[project]
name = "rag-tr"
version = "1.0.0"
description = "Turkish retrieval-augmented generation: Turkish-aware chunking, hybrid search over pgvector + BM25, cited answers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
authors = [{ name = "hekimcan206" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "numpy>=2.1",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "snowballstemmer>=2.2",
    "typer>=0.15",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[project.optional-dependencies]
# Real embedding models and cross-encoder rerankers. Kept optional so the core library, the unit tests and
# the deterministic CI path install in seconds without PyTorch.
ml = [
    "sentence-transformers>=3.3",
    "torch>=2.5",
]

[project.scripts]
ragtr = "ragtr.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "respx>=0.22",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
default-groups = ["dev"]

# CPU-only PyTorch wheels: the CUDA build is ~2.5 GB and nothing here needs a GPU to run.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragtr"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "C4", "PTH", "PL", "TRY"]
ignore = [
    "PLR0913", # retrieval configs legitimately take many knobs
    "PLR2004", # thresholds are named where they matter
    "PLR0917", # Typer commands and small value constructors take positional options
    "TRY003",
    "RUF001",  # Turkish text contains ı, İ, ş … on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "PLR0915", "S105", "S106"]
"scripts/**" = ["S311"]
"src/ragtr/data/**" = ["S311"] # seeded random for synthetic data, not security
# Turkish template sentences and abbreviation tables read better unwrapped.
"src/ragtr/data/synth.py" = ["S311", "E501"]
"src/ragtr/text/{turkish,sentences}.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["ragtr"]

[[tool.mypy.overrides]]
module = ["snowballstemmer.*", "pgvector.*", "sentence_transformers.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs Docker (Testcontainers PostgreSQL + pgvector)",
]

[tool.coverage.run]
source = ["ragtr"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = false
